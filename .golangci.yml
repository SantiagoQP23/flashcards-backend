version: '2'
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  exclusions:
    paths:
      - internal/httpapi/api.gen.go
      - internal/db/.*\.sql\.go
      - internal/db/models.go
      - internal/db/db.go
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SantiagoQP23/flashcards-backend
