name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flashcards
          POSTGRES_PASSWORD: flashcards
          POSTGRES_DB: flashcards
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flashcards"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flashcards:flashcards@localhost:5432/flashcards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code || (echo "Run 'make generate' and commit the result" && exit 1)
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go build ./...
      - run: go run ./cmd/migrate
      - run: go test -race ./...
