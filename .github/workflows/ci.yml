name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flashcards
          POSTGRES_PASSWORD: flashcards
          POSTGRES_DB: flashcards
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flashcards"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flashcards:flashcards@localhost:5432/flashcards
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm test:e2e
      - name: openapi.json is up to date
        run: |
          pnpm openapi
          git diff --exit-code openapi.json || (echo "Run 'pnpm openapi' and commit openapi.json" && exit 1)
